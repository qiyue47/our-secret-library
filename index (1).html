<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星星和月亮的轨道交点</title>
    <style>
        body {
            background-color: #f3e5f5; /* A light, soft purple */
            margin: 0;
            padding-bottom: 80px; /* Space for the bottom nav */
            font-family: sans-serif;
            color: #333;
            overflow: hidden; /* Hide overflow to prevent scrollbars from appearing for stars */
        }
        .star-effect {
            position: absolute;
            font-size: 24px;
            color: #FFD700; /* Gold color for stars */
            animation: fadeOutUp 1s forwards;
            pointer-events: none; /* Make stars non-interactive */
            user-select: none;
            z-index: 9999;
        }
        @keyframes fadeOutUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #555;
            font-size: 12px;
        }
        nav a .icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .content h1 {
            font-size: 22px;
            color: #6a1b9a; /* A darker purple for the title */
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>星星和月亮的轨道交点</h1>
    </div>
    <nav>
        <a href="#"><span class="icon">📖</span>秘密书架</a>
        <a href="#"><span class="icon">🖼️</span>我们的画廊</a>
        <a href="#"><span class="icon">💎</span>百宝箱</a>
        <a href="#"><span class="icon">⚙️</span>专属设置</a>
    </nav>
    <script>
        document.addEventListener('click', function(e) {
            let star = document.createElement('div');
            star.className = 'star-effect';
            star.textContent = '⭐';
            star.style.left = e.clientX - 12 + 'px'; // Center the star on the cursor
            star.style.top = e.clientY - 12 + 'px';
            document.body.appendChild(star);
            setTimeout(() => {
                star.remove();
            }, 1000); // Remove the star after the animation ends
        });
    </script>
</body>
</html>
